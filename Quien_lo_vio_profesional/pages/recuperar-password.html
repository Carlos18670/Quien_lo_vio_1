
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | ¿Quién lo vio?</title>

    <link rel="stylesheet" href="../css/global.css">

    
</head>

<body>

    <main class="recuperar-container">

        <h1>Recuperar contraseña</h1>

        <!-- SOLICITAR RECUPERACIÓN -->
        <section id="seccion-correo">

            <p>
                Escribe el correo electrónico asociado a tu cuenta.
                Te enviaremos un enlace para recuperar tu contraseña.
            </p>

            <form id="form-recuperar">

                <input
                    type="email"
                    id="correo-recuperacion"
                    placeholder="Correo electrónico"
                    required
                >

                <button type="submit" class="btn primary full" id="btn-enviar">
                    Enviar enlace de recuperación
                </button>

            </form>

        </section>

        <!-- ESTABLECER NUEVA CONTRASEÑA -->
        <section id="seccion-password" class="oculto">

            <p>
                Escribe tu nueva contraseña y confírmala para actualizar
                tu cuenta.
            </p>

            <form id="form-nueva-password">

                <input
                    type="password"
                    id="nueva-password"
                    placeholder="Nueva contraseña"
                    minlength="8"
                    required
                >

                <input
                    type="password"
                    id="confirmar-password"
                    placeholder="Confirmar nueva contraseña"
                    minlength="8"
                    required
                >

                <button type="submit" class="btn primary full" id="btn-actualizar">
                    Cambiar contraseña
                </button>

            </form>

        </section>

        <p id="mensaje-recuperacion" class="mensaje-recuperacion"></p>

        <a href="login.html" class="volver-login">
            Volver al inicio de sesión
        </a>

    </main>

    <script type="module" src="../js/pages/recuperar-password.js"></script>

</body>
</html>
